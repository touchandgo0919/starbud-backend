name = "starbud-backend"
main = "src/index.ts"
compatibility_date = "2026-07-21"

[vars]
APP_TIME_ZONE = "Asia/Shanghai"
AI_PROVIDER = "OpenAI"
AI_BASE_URL = "https://sub2api.wodcloud.com"
AI_RESPONSES_PATH = "/v1/responses"
AI_MODEL = "gpt-5.5"
AI_REASONING_EFFORT = "xhigh"
AI_ANALYSIS_HOUR = "4"

[[d1_databases]]
binding = "DB"
database_name = "starbud"
database_id = "d92cfdd6-53c5-4345-a919-a27f96d79678"
migrations_dir = "../migrations"

[[r2_buckets]]
binding = "SUBMISSION_FILES"
bucket_name = "starbud-submissions"

# Durable Objects will be added when the child app WebSocket channel is implemented.

[triggers]
crons = ["* * * * *"]
